<div class="p-4 sm:ml-64 animate-slide-in">
  <br><br><br>
  <app-appointment-form></app-appointment-form>
  <br><br><br><br><br>
  <div *ngIf="appointments$ | async as appointments; else loading" class="p-6">
    <table class="w-full border-collapse border border-gray-300 shadow-md rounded-lg">
      <thead>
        <tr class="bg-gray-200 text-left">
          <th class="border border-gray-300 p-2">Cliente</th>
          <th class="border border-gray-300 p-2">Fecha</th>
          <th class="border border-gray-300 p-2">Hora</th>
          <th class="border border-gray-300 p-2">Descripción</th>
          <th class="border border-gray-300 p-2">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let appointment of appointments" class="border border-gray-300">
          <td class="border border-gray-300 p-2">{{ appointment.cliente }}</td>
          <td class="border border-gray-300 p-2">{{ appointment.fecha }}</td>
          <td class="border border-gray-300 p-2">{{ appointment.hora }}</td>
          <td class="border border-gray-300 p-2">{{ appointment.descripcion }}</td>
          <td class="border border-gray-300 p-2">
            <button (click)="deleteAppointment(appointment.id!)"
              class="bg-red-500 text-white px-3 py-1 rounded-lg hover:bg-red-600">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>

  </div>

  <ng-template #loading>
    <p class="text-center text-gray-600">Cargando citas...</p>
  </ng-template>

  <ng-template #empty>
    <p class="text-center text-gray-600">No hay citas registradas.</p>
  </ng-template>


</div>
