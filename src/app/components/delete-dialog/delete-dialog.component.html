<h1 mat-dialog-title>Eliminar Registro</h1>
<div mat-dialog-content>
  ¿Deseas eliminar el registro?</div>
<div mat-dialog-actions align="end">
  <button mat-stroked-button color="primary" mat-button mat-dialog-close>Cancelar</button>
  <button mat-stroked-button color="warn" style="margin-left: 15px" mat-button mat-dialog-close
    (click)="confirmarEliminacion()">Eliminar</button>
</div>
