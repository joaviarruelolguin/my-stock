<h1 mat-dialog-title class="text-center">Editar Banner</h1>
<mat-dialog-content>
  <div class="flex flex-col space-y-4">

    <!-- Imagen Banner-->
    <div class="flex flex-col">
      <h5 class="text-start mx-1 mt-1">Imagen Banner (Url)</h5>
      <input type="text"
        class="w-full bg-white rounded border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out"
        [(ngModel)]="userBackground">
      <h5 class="text-start mx-1 mt-2 text-gray-900">Elegí una imagen con disposición horizontal en: <a
          href="https://unsplash.com/" target="_blank" class="text-blue-700">Unsplash </a>Copia su enlace y pegalo acá!
      </h5>
    </div>

    <!-- Imagen Login-->
    <!-- <div class="flex flex-col">
      <h5 class="text-start mx-1 mt-1">Imagen Inicio de sesión</h5>
      <input type="text" class="form-control form-control-lg mt-1" [(ngModel)]="userLoginBackground">
    </div> -->

    <!-- Color -->
    <div class="flex flex-col items-start">
      <h5 class="text-start mx-1 mt-1">Color</h5>
      <input type="color" class=" w-10 h-10 cursor-pointer rounded-lg appearance-none  transition-colors duration-200"
        [(ngModel)]="userColor">
    </div>

    <!-- Posición -->
    <div class="flex flex-col">
      <h5 class="text-start mx-1 mt-1">Posición</h5>
      <div class="flex flex-col space-y-2">
        <label class="flex items-center">
          <input id="radio-top" type="radio" value="top" name="position-radio"
            class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500" [(ngModel)]="userPosition">
          <span class="ms-2 text-sm font-medium text-gray-900 dark:text-gray-900">Arriba</span>
        </label>

        <label class="flex items-center">
          <input id="radio-center" type="radio" value="center" name="position-radio"
            class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500" [(ngModel)]="userPosition">
          <span class="ms-2 text-sm font-medium text-gray-900 dark:text-gray-900">Centro</span>
        </label>

        <label class="flex items-center">
          <input id="radio-bottom" type="radio" value="bottom" name="position-radio"
            class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500" [(ngModel)]="userPosition">
          <span class="ms-2 text-sm font-medium text-gray-900 dark:text-gray-900">Abajo</span>
        </label>
      </div>
    </div>

  </div>
</mat-dialog-content>

<mat-dialog-actions class="mt-5" align="end">
  <button mat-raised-button color="accent" mat-button mat-dialog-close>Cerrar</button>
  <button mat-raised-button color="primary" mat-button (click)="updateBanner()">Guardar</button>
</mat-dialog-actions>
