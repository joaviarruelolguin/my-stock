<div class="animate-slide-in">
  <div class="p-4 sm:ml-64">
    <!-- <div class="w-full mx-auto p-5 rounded-lg shadow-md  bg-white mt-1 bg-white ">
      <div class="w-full flex items-baseline">
        <div
          class="me-4 mt-5 text-4xl font-bold leading-none tracking-tight text-gray-700 md:text-4xl lg:text-5xl sm:3xl no-select ">
          Egresos
        </div>
      </div>
    </div> -->
    <app-banner>{{subtitle}}</app-banner>

    <div class="container mx-auto">
      <button mat-raised-button color="primary" (click)="openDialog()" *ngIf="isAdmin">
        Nuevo Egreso
      </button>


      <br><br><br>


      <div class="w-6/12">
        <label for="mes" class="leading-7 text-sm  font-medium text-gray-900">Filtrar por mes:</label>
        <select id="mes" (change)="filtrarPorMes($event)"
          class="w-full bg-white rounded border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-3 px-3 leading-8 transition-colors duration-200 ease-in-out">
          <option value="">Todos</option>
          <option *ngFor="let mes of meses" [value]="mes.num">{{ mes.nombre }}</option>
        </select>
      </div>


      <ol class="relative border-s border-gray-200 p-5" *ngFor="let egreso of gastosPaginados">
        <li class="mb-10 ms-6 shadow-md">
          <span
            class="absolute flex items-center justify-center w-12 h-12 border border-gray-200 rounded-full -start-3 ring-8 ring-white bg-[#1f2937]">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#fff">
              <path
                d="M480-200 240-440l56-56 184 183 184-183 56 56-240 240Zm0-240L240-680l56-56 184 183 184-183 56 56-240 240Z" />
            </svg>
          </span>
          <div class="items-center justify-between p-4 bg-white border border-gray-200 rounded-lg shadow-sm sm:flex ">
            <time class="mb-1 mt-3  text-xs font-normal text-big-stone-700  sm:mb-0">{{egreso.fecha| date:
              'dd/MM/yyyy'}}</time>
            <div class=" mt-3 text-sm font-normal text-gray-500 ">Egreso: <a href="#"
                class=" font-semibold text-gray-700  hover:underline uppercase">{{egreso.tipo.slice(0, 20)}}</a>
              <br>Monto:
              <span class="mt-3 text-green-600 text-xs font-bold  ">{{egreso.monto|
                currency:'$':'symbol':'1.0'}}</span>
              <br>Descripción: <span class="uppercase">{{egreso.descripcion.slice(0, 20)}}</span>
            </div>

            <div class="flex justify-end mt-5">
              <button type="button" matTooltip="Eliminar" (click)="openDeleteDialog(egreso)"
                class="ms-5 bg-gray-100 hover:bg-red-300 text-white font-bold py-2 px-2 rounded-full" *ngIf="isAdmin">
                <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                  fill="#aa140a">
                  <path
                    d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z" />
                </svg>
              </button>
              <button type="button" matTooltip="Editar" (click)="openDialog(egreso)"
                class="ms-5 bg-gray-100 hover:bg-blue-300 text-white font-bold py-2 px-2 rounded-full" *ngIf="isAdmin ">
                <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                  fill="#5985E1">
                  <path
                    d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z" />
                </svg>
              </button>
            </div>
          </div>

        </li>
      </ol>

      <br><br>
      <p class="text-center text-gray-700" *ngIf="gastosPaginados.length === 0">No hay registros disponibles.</p>
      <br>
      <mat-paginator [length]="gastos.length" [pageSize]="pageSize" (page)="onPageChange($event)"
        [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </div>
    <div>
    </div>
  </div>
</div>
