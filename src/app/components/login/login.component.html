<div class="h-full flex items-center bg-[#0f172a]">
  <div
    class="flex w-10/12 sm:w-full max-w-sm mx-auto overflow-hidden bg-white rounded-lg shadow-lg dark:bg-gray-800 lg:max-w-4xl">
    <div class="hidden bg-center bg-cover lg:block lg:w-1/2"
      style="background-image: url('../../../assets/my-stock-minimal.webp');">
    </div>

    <div class="w-full px-6 py-8 md:px-8 lg:w-1/2">
      <div class="flex justify-center mx-auto">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#426287" height="27px" width="27px">
          <path
            d="M12.378 1.602a.75.75 0 0 0-.756 0L3 6.632l9 5.25 9-5.25-8.622-5.03ZM21.75 7.93l-9 5.25v9l8.628-5.032a.75.75 0 0 0 .372-.648V7.93ZM11.25 22.18v-9l-9-5.25v8.57a.75.75 0 0 0 .372.648l8.628 5.033Z" />
        </svg>
      </div>
      <br>
      <p class="mt-5 text-xl text-center text-gray-600 dark:text-gray-200">
        Bienvenido
      </p>

      <div class="flex items-center justify-between mt-4">
        <span class="w-1/5 border-b dark:border-gray-600 lg:w-1/4"></span>
        <span class="text-xs text-center text-gray-500 uppercase dark:text-gray-400 no-select">Inicia sesion
        </span>
        <span class="w-1/5 border-b dark:border-gray-400 lg:w-1/4"></span>
      </div>

      <form [formGroup]="formLogin" (ngSubmit)="onSubmit()">
        <div class="mt-4">
          <label class="block mb-2 text-sm font-medium text-gray-600 dark:text-gray-200"
            for="LoggingEmailAddress">Email</label>
          <mat-form-field class="w-full text-sm">
            <input matInput formControlName="email" type="email"
              class="block w-full px-4 py-2 text-gray-700 bg-white border rounded-lg dark:bg-gray-800 dark:text-gray-300 dark:border-gray-600 ">
          </mat-form-field>

        </div>

        <div class="mt-2">
          <label class="block mb-2 text-sm font-medium text-gray-600 dark:text-gray-200"
            for="loggingPassword">Contraseña</label>
          <mat-form-field class="w-full">
            <input matInput formControlName="password" [type]="hide ? 'password' : 'text'"
              class="block w-full px-4 py-2 text-gray-700 bg-white border rounded-lg dark:bg-gray-800 dark:text-gray-300 dark:border-gray-600 "
              formControlName="password">
            <button mat-icon-button matSuffix (click)=" hide=!hide" [attr.aria-label]="'Hide password'"
              [attr.aria-pressed]="hide" type="button">
              <mat-icon style="color: rgb(176, 176, 181);">{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
          </mat-form-field>
        </div>
        <small *ngIf="loginError" class="text-red-600 ">Usuario o contraseña
          incorrectos.</small>
        <div class="mt-3">
          <button type="submit"
            class="w-full px-6 py-3 text-sm font-medium tracking-wide text-white capitalize transition-colors duration-300 transform bg-blue-800 rounded-lg hover:bg-sky-700 focus:outline-none focus:ring focus:ring-sky-300 focus:ring-opacity-50">
            Iniciar sesión
          </button>
        </div>
        <div class="mt-3">
          <button type="submit" (click)="fillGuestCredentials()"
            class="w-full px-6 py-3 text-sm font-medium tracking-wide text-white  transition-colors duration-300 transform bg-cyan-700 rounded-lg hover:bg-sky-700 focus:outline-none focus:ring focus:ring-sky-300 focus:ring-opacity-50">
            Iniciar Sesión como Invitado
          </button>
        </div>
      </form>

      <div class="flex items-center justify-between mt-6">
        <span class="w-1/5 border-b dark:border-gray-600 md:w-1/4"></span>
        <span class="text-xs text-gray-500 uppercase dark:text-gray-400 no-select">APP STOCK</span>
        <span class="w-1/5 border-b dark:border-gray-600 md:w-1/4"></span>
      </div>
    </div>
  </div>
</div>
