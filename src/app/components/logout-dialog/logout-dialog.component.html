<h1 mat-dialog-title>Cerrar Sesión</h1>
<div mat-dialog-content>
  ¿Deseas cerrar sesión?</div>
<div mat-dialog-actions align="end">
  <button mat-stroked-button color="primary" mat-dialog-close>Cancelar</button>
  <button mat-stroked-button color="warn" (click)="onClick()" mat-dialog-close>Confirmar</button>
</div>
