<h1 mat-dialog-title class="text-center uppercase"> {{marcaProducto}}</h1>
<div mat-dialog-content>

  <div class="flex">
    <div class="relative w-full">
      <input matInput (keyup)="applyFilter($event)" placeholder="Buscar productos"
        class="block w-full p-4 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-100 dark:placeholder-gray-600 dark:text-black dark:focus:ring-blue-500 dark:focus:border-blue-500 focus:outline-none"
        #input>
      <!-- Icono de cerrar -->
      <mat-icon *ngIf="input.value" (click)="clearInput(input)"
        class="absolute end-4 top-1/2 -translate-y-1/2 cursor-pointer text-gray-300">
        close
      </mat-icon>
    </div>

    <button mat-icon-button matSuffix (click)="openBarcodeScanner()" matTooltip="Escanear desde cámara">
      <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#999999">
        <path
          d="M48-144v-192h72v120h120v72H48Zm672 0v-72h120v-120h72v192H720ZM168-264v-432h72v432h-72Zm120 0v-432h48v432h-48Zm120 0v-432h72v432h-72Zm120 0v-432h96v432h-96Zm132 0v-432h48v432h-48Zm84 0v-432h48v432h-48ZM48-624v-192h192v72H120v120H48Zm792 0v-120H720v-72h192v192h-72Z" />
      </svg></button>
  </div>

  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort
      class="mat-elevation-z8  mt-5 table table-striped dark:bg-slate-800 " matSort>
      <ng-container matColumnDef="imagen">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Imagen </th>
        <td mat-cell *matCellDef="let producto">
          <img [src]="producto.imagen" class="product-image not-image rounded-full"
            onerror="this.onerror=null;this.src='../../../assets/not-image.webp';this.classList.add('not-image');" />
        </td>
      </ng-container>

      <!-- <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Marca </th>
      <td mat-cell *matCellDef="let producto" class="uppercase"> {{producto.nombre}} </td>
    </ng-container> -->

      <ng-container matColumnDef="modelo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Modelo </th>
        <td mat-cell *matCellDef="let producto" class="uppercase font-bold"> {{producto.modelo}} </td>
      </ng-container>

      <ng-container matColumnDef="proveedor">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Proveedor </th>
        <td mat-cell *matCellDef="let producto" class="uppercase"> {{producto.proveedor}} </td>
      </ng-container>

      <ng-container matColumnDef="color">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Color </th>
        <td mat-cell *matCellDef="let producto"> {{producto.color}} </td>
      </ng-container>

      <ng-container matColumnDef="cantidad">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Cantidad </th>
        <td mat-cell *matCellDef="let producto" class="font-bold" [ngClass]="{
   'text-red-600 ': producto.cantidad === 0,
    'text-red-500': producto.cantidad > 0 && producto.cantidad <= stockThreshold
  }">
          {{ producto.cantidad }}
        </td>
      </ng-container>

      <ng-container matColumnDef="talle">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Talle </th>
        <td mat-cell *matCellDef="let producto"> {{producto.talle}} </td>
      </ng-container>

      <ng-container matColumnDef="precio">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Precio </th>
        <td mat-cell *matCellDef="let producto" class="uppercase"> {{producto.precio| currency:'$':'symbol':'1.0' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let producto">
          <button matTooltip="Agregar al carrito" mat-icon-button (click)="moveProductToCart(producto)">
            <mat-icon class="text-gray-800 text-lg ">shopping_cart</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="even:bg-gray-100 odd:bg-white"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell text-gray-900" colspan="4">No hay datos que coincidan con el filtro:"{{input.value}}"</td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[20, 30, 50]" showFirstLastButtons></mat-paginator>
  </div>
</div>


<div mat-dialog-actions align="end">
  <button mat-stroked-button color="warn" mat-dialog-close>Cerrar</button>
</div>
