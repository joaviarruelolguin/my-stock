<div class="mt-12 w-full md:w-4/5 lg:w-4/5 mx-auto " *ngIf="users$ | async as users">
  <div class="relative overflow-x-auto shadow-md rounded-lg">
    <table class="w-full text-sm text-center  text-gray-500 dark:text-gray-400 uppercase table-auto ">
      <thead class="text-xs text-white uppercase  dark:bg-gray-700  ">
        <tr>
          <th scope="col" class="px-6 py-3">
            Color
          </th>
          <th scope="col" class="px-6 py-3">
            Nombre
          </th>
          <th scope="col" class="px-6 py-3">
            Rol
          </th>
          <th scope="col" class="px-6 py-3">
            Email
          </th>
          <th scope="col" class="px-6 py-3">
            Acciones
          </th>

        </tr>
      </thead>
      <tbody>
        <tr class="odd:bg-white even:bg-gray-50 even:dark:bg-gray-100 text-gray-900 border-b"
          *ngFor="let user of users">
          <td class="px-6 py-4 ">
            <div class="flex items-center justify-center">
              <div class="h-4 w-4 me-3 rounded-full " [ngStyle]="{ 'background-color': getColor(user.color) }">
              </div>
            </div>
          </td>
          <td scope="row" class="px-6 py-4 font-medium whitespace-nowrap ">
            {{user.name}}
          </td>
          <td class="px-6 py-4 ">
            {{ user.role }}
          </td>
          <td class="px-6 py-4 ">
            {{ user.email }}
          </td>
          <td class="px-6 py-4 font-medium  whitespace-nowrap flex justify-center items-center">
            <button *ngIf="showDeleteButton(user.uid!)" matTooltip="Eliminar usuario" mat-icon-button
              (click)="openDeleteDialog(user.uid!)">
              <mat-icon>delete</mat-icon>
            </button>
            <div *ngIf="!showDeleteButton(user.uid!)" style="width: 46px;"></div>
            <button *ngIf="isAdmin" mat-icon-button (click)="onEditUser(user)"><mat-icon>edit</mat-icon></button>
          </td>

        </tr>
      </tbody>
    </table>
  </div>

</div>
